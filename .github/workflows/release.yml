name: Release
on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build on a provisioned signing runner
        type: choice
        required: true
        options: [android, ios, windows, macos, linux]
      draft_release:
        description: Create a draft GitHub Release after signing verification
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  distribution-build:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: [self-hosted, client-signing, "${{ inputs.target }}"]
    timeout-minutes: 60
    environment: production
    env:
      APP_CHANNEL: production
      RELEASE_BUILD: "1"
      DESKTOP_NOTARIZE: ${{ inputs.target == 'macos' && '1' || '0' }}
      RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
      RELEASE_TARGET: ${{ inputs.target }}
      ANDROID_KEYSTORE_PATH: ${{ vars.ANDROID_KEYSTORE_PATH }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_EXPORT_OPTIONS: ${{ vars.IOS_EXPORT_OPTIONS }}
      CSC_NAME: ${{ vars.CSC_NAME }}
      WINDOWS_CERTIFICATE_SHA1: ${{ vars.WINDOWS_CERTIFICATE_SHA1 }}
      APPLE_KEYCHAIN_PROFILE: ${{ vars.APPLE_KEYCHAIN_PROFILE }}
      APPLE_KEYCHAIN: ${{ vars.APPLE_KEYCHAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node scripts/release.mjs ci
      - run: npm run credentials:status
      - run: node scripts/release.mjs build-release
      - run: node scripts/release.mjs verify-signature
      - run: npm run artifacts -- ${{ inputs.target == 'android' && 'android' || inputs.target == 'ios' && 'ios' || 'desktop' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-${{ inputs.target }}-${{ github.ref_name }}-${{ github.sha }}
          path: artifacts/staging
          if-no-files-found: error
          retention-days: 14
  draft:
    if: inputs.draft_release
    needs: distribution-build
    env:
      RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Download exact signed build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --dir artifacts/release
      - name: Create draft release (no store submission)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release.mjs draft
